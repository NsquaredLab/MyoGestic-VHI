# This is a Godot / .NET project — not a Python package. This pyproject.toml
# exists only to pin the documentation toolchain (ProperDocs / MkDocs Material)
# so it can be run with `uv`:
#
#     uv run --group docs properdocs serve     # live preview at localhost:8000
#     uv run --group docs properdocs build     # render the static site into site/
#
# See docs/ for the documentation sources and properdocs.yml for the site config.

[project]
name = "virtual-hand-interface-docs"
version = "0"
description = "Documentation toolchain for the Virtual Hand Interface."
requires-python = ">=3.12"

[tool.uv]
package = false

[dependency-groups]
# The automated contract test (tests/test_v2_contract.py) launches VHI and drives it
# over gRPC. Stubs are generated at session start rather than committed, so the test
# can never drift from proto/. The other files in tests/ are interactive monitors.
test = [
    "pytest>=8.0",
    "grpcio>=1.60",
    "grpcio-tools>=1.60",
    # For the direction anchor only. gRPC can drive the predicted hand and read its bones
    # back, but it cannot see where a *named movement* put the control hand — and that is
    # the one piece of ground truth in the system that no renderer computes, because
    # `Movements.Index` is index flexion by virtue of being called that. Reading it needs
    # the VHI_Control outlet.
    "pylsl>=1.16",
]
docs = [
    "properdocs",
    "mkdocs-material>=9.5",
    "pymdown-extensions>=10.0",
    "mkdocs-section-index>=0.3",
]
