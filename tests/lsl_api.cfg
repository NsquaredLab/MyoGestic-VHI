; liblsl config for the test suite: discovery on this machine only, the same config VHI
; writes for itself by default (LSLWrapper.ConfigureLiblsl). conftest.py points both the
; tests ($LSLAPICFG) and the VHI it launches ($VHI_LSLAPICFG) at this file.
;
; KnownPeers is not optional here. On liblsl 1.16/1.17 machine scope alone finds one stream
; per machine: every outlet listens on the shared port 16571 and the OS hands a unicast
; query to only one of them. KnownPeers asks each outlet on its own port instead.
[ports]
IPv6 = disable

[multicast]
ResolveScope = machine

[lab]
KnownPeers = {127.0.0.1}
